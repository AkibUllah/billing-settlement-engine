# Render blueprint: Django API (migrates and seeds demo data on start) + managed PostgreSQL.
# ALLOWED_HOSTS and CSRF origins pick up RENDER_EXTERNAL_HOSTNAME automatically; the demo
# admin login and API token are printed to the service logs by seed_demo.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: billing-settlement-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: DEFAULT_VAT_RATE
        value: "15"
      - key: SEED_DEMO_ON_START
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: billing-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true

databases:
  - name: billing-db
    plan: free
    databaseName: billing
    user: billing
